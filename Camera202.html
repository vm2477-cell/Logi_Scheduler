<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
         /* --- 주의 사항 (향후 수정을 위한 참고사항) --- */
         /* 1. 이 파일은 index.html과 별개로 단독 실행 가능해야 합니다. */
         /* 2. 외부 라이브러리(tailwindcss, pdf.js, genai) 외에 다른 파일 의존성을 만들지 마세요. */
         /* 3. 메인 앱(index.html)의 UI/UX와 최대한 유사한 경험을 제공해야 합니다. */
         /* 4. API 키는 로컬 스토리지에 저장되며, 외부로 노출되지 않도록 주의해야 합니다. */
         /* 5. 이 주의사항은 수정하지 마세요. */
         /* --- 주의 사항 종료 --- */
        :root { color-scheme: light; }
        html.dark { color-scheme: dark; }
        .tab-button { transition: color 0.2s, border-color 0.2s; }
        .loading-overlay { background-color: rgba(0, 0, 0, 0.75); }
    </style>
    <script type="module">
        pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js`;

        document.addEventListener('DOMContentLoaded', () => {
            const app = {
                // --- STATE ---
                state: {
                    activeTab: 'pdf',
                    drivers: [],
                    selectedDriver: null,
                    isLoading: false,
                    loadingText: '',
                    errorMessage: null,
                    isAndroid: false,
                    
                    // Tab 1: 휴차표 분석 State
                    pdfFile: null,
                    pdfDoc: null,
                    pdfPage: null,
                    pdfTextContentItems: null,
                    pdfFolderHandle: null,
                    foundCourseName: null,
                    foundScheduleDate: null,
                    foundCourseType: null,
                    showVisualization: true,
                    userDefinedCourseAreaSize: { width: 60, height: 34 },
                    userDefinedCourseAreaOffset: { x: 0, y: 0 },
                    anchorCourseItem: null,
                    dynamicCourseArea: null,
                    originalFoundCourseName: null,
                },

                // --- DOM ELEMENTS ---
                elements: {
                    panelPdf: document.getElementById('panel-pdf'),
                    loadingOverlay: document.getElementById('loading-overlay'),
                    loadingText: document.getElementById('loading-text'),
                    errorOverlay: document.getElementById('error-overlay'),
                    errorMessage: document.getElementById('error-message'),
                    errorRetryBtn: document.getElementById('error-retry-btn'),

                    // Tab 1 Elements
                    driverSelect: document.getElementById('driver-select'),
                    pdfInput: document.getElementById('pdf-input'),
                    pdfFileInputLabel: document.getElementById('pdf-file-input-label'),
                    pdfSetFolderBtn: document.getElementById('pdf-set-folder-btn'),
                    pdfFolderPath: document.getElementById('pdf-folder-path'),
                    pdfLoadLatestBtn: document.getElementById('pdf-load-latest-btn'),
                    androidPdfHelper: document.getElementById('android-pdf-helper'),
                    pdfAnalyzeBtn: document.getElementById('pdf-analyze-btn'),
                    pdfResult: document.getElementById('pdf-result'),
                    pdfResultText: document.getElementById('pdf-result-text'),
                    showVisualizationCheckbox: document.getElementById('show-visualization-checkbox'),
                    pdfVisualizationWrapper: document.getElementById('pdf-visualization-wrapper'),
                    pdfVisualizationContainer: document.getElementById('pdf-visualization-container'),
                    dynamicAreaCoords: document.getElementById('dynamic-area-coords'),
                    offsetControls: document.getElementById('offset-controls'),
                    reanalyzeOffsetBtn: document.getElementById('reanalyze-offset-btn'),
                },

                // --- INITIALIZATION ---
                init() {
                    this.state.isAndroid = /android/i.test(navigator.userAgent);
                    this.loadDrivers();
                    this.loadPdfAnalysisSettings();
                    this.initPdfFolderHandle();
                    this.setupPlatformSpecificUI();
                    this.bindEvents();
                },

                // --- PLATFORM-SPECIFIC UI ---
                setupPlatformSpecificUI() {
                    if (!this.state.isAndroid) return;
                    
                    // Tab 1: PDF helper text
                    this.elements.androidPdfHelper.classList.remove('hidden');
                },

                // --- EVENT BINDING ---
                bindEvents() {
                    this.elements.errorRetryBtn.addEventListener('click', () => this.hideError());

                    // Tab 1 Events
                    this.elements.driverSelect.addEventListener('change', (e) => this.state.selectedDriver = e.target.value);
                    this.elements.pdfInput.addEventListener('change', (e) => this.handlePdfFileSelect(e.target.files[0]));
                    this.elements.pdfSetFolderBtn.addEventListener('click', () => this.setPdfFolder());
                    this.elements.pdfLoadLatestBtn.addEventListener('click', () => this.loadLatestPdfFromHandle());
                    this.elements.pdfAnalyzeBtn.addEventListener('click', () => this.analyzePdf());
                    this.elements.showVisualizationCheckbox.addEventListener('change', (e) => this.toggleVisualizationVisibility(e.target.checked));
                    this.elements.offsetControls.addEventListener('click', (e) => this.handleOffsetControls(e));
                    this.elements.reanalyzeOffsetBtn.addEventListener('click', () => this.reanalyzeWithCurrentData());
                },

                // --- UI & STATE MANAGEMENT ---
                showLoading(text) {
                    this.state.isLoading = true;
                    this.elements.loadingText.textContent = text;
                    this.elements.loadingOverlay.classList.remove('hidden');
                    this.elements.loadingOverlay.classList.add('flex');
                },

                hideLoading() {
                    this.state.isLoading = false;
                    this.elements.loadingOverlay.classList.add('hidden');
                    this.elements.loadingOverlay.classList.remove('flex');
                },

                showError(message) {
                    this.hideLoading();
                    this.elements.errorMessage.textContent = message;
                    this.elements.errorOverlay.classList.remove('hidden');
                    this.elements.errorOverlay.classList.add('flex');
                },
                
                hideError() {
                    this.elements.errorOverlay.classList.add('hidden');
                    this.elements.errorOverlay.classList.remove('flex');
                },

                showNotification(message, duration = 3000) {
                    const notification = document.createElement('div');
                    notification.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-blue-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-opacity duration-300';
                    notification.textContent = message;
                    document.body.appendChild(notification);
                    setTimeout(() => {
                        notification.style.opacity = '0';
                        setTimeout(() => notification.remove(), 300);
                    }, duration);
                },

                // --- DATA HANDLING ---
                loadDrivers() {
                    try {
                        const driversData = localStorage.getItem('logistics_drivers');
                        this.state.drivers = driversData ? JSON.parse(driversData) : [];
                        if (this.state.drivers.length > 0) {
                            this.elements.driverSelect.innerHTML = `<option value="">기사 선택</option>${this.state.drivers.map(d => `<option value="${d.name}">${d.name}</option>`).join('')}`;
                        } else {
                             this.elements.driverSelect.innerHTML = `<option value="">메인 앱에서 기사를 등록해주세요</option>`;
                             this.elements.driverSelect.disabled = true;
                        }
                    } catch (e) { console.error("Failed to load drivers:", e); }
                },

                // --- TAB 1 (휴차표 분석) FILE HANDLING ---
                handlePdfFileSelect(file) {
                    const label = this.elements.pdfFileInputLabel;
                    if (!file) {
                        this.elements.pdfInput.value = '';
                        return;
                    }

                    // PDF 파일 유효성 검사
                    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                        label.innerHTML = `
                            <span class="block text-3xl mb-2">⚠️</span>
                            <span class="font-medium text-red-600 dark:text-red-400">PDF 파일만 선택할 수 있습니다.</span>
                            <span class="block text-xs mt-1">다시 클릭하여 올바른 파일을 선택해주세요.</span>
                        `;
                        label.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'font-semibold');
                        label.classList.add('text-gray-500', 'dark:text-gray-400');
                        
                        this.elements.pdfInput.value = '';
                        this.state.pdfFile = null;
                        this.elements.pdfAnalyzeBtn.disabled = true;
                        return;
                    }

                    this.state.pdfFile = file;
                    this.elements.pdfAnalyzeBtn.disabled = !this.state.selectedDriver;
                    this.elements.pdfResult.classList.add('hidden');
                    this.elements.pdfVisualizationWrapper.classList.add('hidden');
                    this.state.pdfDoc = null; // Reset cached doc
                    
                    // Update UI to show selected file name
                    label.textContent = `선택된 파일: ${file.name}`;
                    label.classList.remove('text-gray-500', 'dark:text-gray-400');
                    label.classList.add('text-indigo-600', 'dark:text-indigo-400', 'font-semibold');
                },

                // --- VISUALIZATION LOGIC (COMMON) ---
                handleOffsetControls(e) {
                    const adjustBtn = e.target.closest('[data-action]');
                    if (!adjustBtn) return;
                    const { action, axis, value } = adjustBtn.dataset;
                    const val = parseInt(value, 10);
                    if (action === 'adjust-offset') {
                        this.adjustCourseAreaOffset(axis, val);
                    } else if (action === 'adjust-size') {
                        this.adjustCourseAreaSize(axis, val);
                    }
                },

                _calculateDynamicArea(anchorItem, areaSize, areaOffset, canvas, scale) {
                    if (!anchorItem) return null;
                    const canvasHeight = canvas.height;
                    const anchorCenterX = (anchorItem.transform[4] + anchorItem.width / 2) * scale;
                    const anchorCenterY = canvasHeight - ((anchorItem.transform[5] + anchorItem.height / 2) * scale);
                    const offsetX = areaOffset.x;
                    const offsetY = areaOffset.y;
                    return {
                        x: anchorCenterX - (areaSize.width / 2) - 1 + offsetX,
                        y: anchorCenterY - (areaSize.height / 2) - 5 + offsetY,
                        width: areaSize.width,
                        height: areaSize.height,
                    };
                },
                
                async _renderVisualization(config) {
                     if (!config.page || !config.items) return;
                    const scale = 2.0;
                    const viewport = config.page.getViewport({ scale });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.maxWidth = '100%';

                    await config.page.render({ canvasContext: context, viewport: viewport }).promise;

                    if (config.showVisualization) {
                        // Draw item boxes (red)
                        context.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                        context.lineWidth = 1;
                        config.items.forEach(item => {
                            const [x, y] = [item.transform[4] * scale, canvas.height - ((item.transform[5] + item.height) * scale)];
                            context.strokeRect(x, y, item.width * scale, item.height * scale);
                        });
                    }
                    
                    const dynamicArea = this._calculateDynamicArea(config.anchorItem, config.size, config.offset, canvas, scale);
                    this.state.dynamicCourseArea = dynamicArea;

                    if (dynamicArea) {
                        context.fillStyle = 'rgba(46, 204, 113, 0.25)';
                        context.strokeStyle = 'rgba(39, 174, 96, 0.8)';
                        context.lineWidth = 2;
                        context.fillRect(dynamicArea.x, dynamicArea.y, dynamicArea.width, dynamicArea.height);
                        context.strokeRect(dynamicArea.x, dynamicArea.y, dynamicArea.width, dynamicArea.height);
                        config.coordsEl.innerHTML = `(x:${Math.round(dynamicArea.x)}, y:${Math.round(dynamicArea.y)}) <span class="text-xs ml-1">[w:${config.size.width}, h:${config.size.height} | off: ${config.offset.x},${config.offset.y}]</span>`;
                    } else {
                        config.coordsEl.textContent = '';
                    }
                    
                    config.containerEl.innerHTML = '';
                    config.containerEl.appendChild(canvas);
                    config.wrapperEl.classList.remove('hidden');
                },

                // --- VISUALIZATION LOGIC (TAB 1) ---
                loadPdfAnalysisSettings() {
                    const pref = localStorage.getItem('show_visualization');
                    this.state.showVisualization = pref !== 'false';
                    this.elements.showVisualizationCheckbox.checked = this.state.showVisualization;
                    const settings = JSON.parse(localStorage.getItem('pdf_analysis_settings')) || {};
                    this.state.userDefinedCourseAreaSize = settings.size || { width: 60, height: 34 };
                    this.state.userDefinedCourseAreaOffset = settings.offset || { x: 0, y: 0 };
                },

                savePdfAnalysisSettings() {
                    localStorage.setItem('pdf_analysis_settings', JSON.stringify({
                        size: this.state.userDefinedCourseAreaSize,
                        offset: this.state.userDefinedCourseAreaOffset
                    }));
                },

                toggleVisualizationVisibility(isVisible) {
                    this.state.showVisualization = isVisible;
                    localStorage.setItem('show_visualization', isVisible);
                    if (this.state.pdfPage) this.visualizeTextRestructuring();
                },
                
                adjustCourseAreaSize(axis, value) {
                    if (!this.state.anchorCourseItem) return this.showNotification('먼저 PDF를 분석하여 기준점을 설정해야 합니다.', 2000);
                    if (axis === 'width') this.state.userDefinedCourseAreaSize.width += value;
                    else if (axis === 'height') this.state.userDefinedCourseAreaSize.height += value;
                    this.savePdfAnalysisSettings();
                    this.visualizeTextRestructuring();
                },

                adjustCourseAreaOffset(axis, value) {
                    if (!this.state.anchorCourseItem) return this.showNotification('먼저 PDF를 분석하여 기준점을 설정해야 합니다.', 2000);
                    this.state.userDefinedCourseAreaOffset[axis] += value;
                    this.savePdfAnalysisSettings();
                    this.visualizeTextRestructuring();
                },

                async visualizeTextRestructuring() {
                    await this._renderVisualization({
                        page: this.state.pdfPage, items: this.state.pdfTextContentItems, anchorItem: this.state.anchorCourseItem,
                        size: this.state.userDefinedCourseAreaSize, offset: this.state.userDefinedCourseAreaOffset,
                        showVisualization: this.state.showVisualization, type: 'main',
                        wrapperEl: this.elements.pdfVisualizationWrapper, containerEl: this.elements.pdfVisualizationContainer, coordsEl: this.elements.dynamicAreaCoords
                    });
                },
                
                // --- FILE SYSTEM ACCESS API ---
                async _getDb() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open('file-system-handles', 1);
                        request.onupgradeneeded = () => request.result.createObjectStore('handles');
                        request.onerror = (e) => reject(e);
                        request.onsuccess = () => resolve(request.result);
                    });
                },

                async _getHandleFromDb(key) {
                    const db = await this._getDb();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction('handles', 'readonly');
                        const request = tx.objectStore('handles').get(key);
                        request.onerror = (e) => reject(e);
                        request.onsuccess = () => resolve(request.result);
                    });
                },

                async _setHandleInDb(key, value) {
                    const db = await this._getDb();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction('handles', 'readwrite');
                        const request = tx.objectStore('handles').put(value, key);
                        request.onerror = (e) => reject(e);
                        request.onsuccess = () => resolve();
                    });
                },
                
                async initPdfFolderHandle() {
                    if (!('showDirectoryPicker' in window)) {
                         this.elements.pdfSetFolderBtn.classList.add('hidden');
                         return;
                    }
                    const handle = await this._getHandleFromDb('pdfFolder');
                    if (handle) {
                        const permission = await handle.queryPermission({ mode: 'read' });
                        if (permission === 'granted') {
                            this.state.pdfFolderHandle = handle;
                        } else {
                            await this._setHandleInDb('pdfFolder', undefined); // Clear stale handle
                        }
                    }
                    this.updatePdfFolderUI();
                },

                async setPdfFolder() {
                    try {
                        const handle = await window.showDirectoryPicker();
                        const permission = await handle.requestPermission({ mode: 'read' });
                        if (permission === 'granted') {
                            this.state.pdfFolderHandle = handle;
                            await this._setHandleInDb('pdfFolder', handle);
                            this.updatePdfFolderUI();
                            this.showNotification(`폴더 '${handle.name}'가 지정되었습니다.`);
                        }
                    } catch (err) {
                        if (err.name !== 'AbortError') console.error("Error setting folder:", err);
                    }
                },
                
                updatePdfFolderUI() {
                    if (this.state.pdfFolderHandle) {
                        this.elements.pdfLoadLatestBtn.classList.remove('hidden');
                        this.elements.pdfFolderPath.textContent = `지정된 폴더: ${this.state.pdfFolderHandle.name}`;
                        this.elements.pdfFolderPath.classList.remove('hidden');
                        this.elements.pdfSetFolderBtn.textContent = '폴더 변경';
                    } else {
                        this.elements.pdfLoadLatestBtn.classList.add('hidden');
                        this.elements.pdfFolderPath.classList.add('hidden');
                        this.elements.pdfSetFolderBtn.textContent = '휴차표 폴더 지정';
                    }
                },

                async loadLatestPdfFromHandle() {
                    if (!this.state.pdfFolderHandle) return this.showError("먼저 휴차표 폴더를 지정해주세요.");
                    this.showLoading('지정된 폴더에서 최신 휴차표를 찾는 중...');
                    try {
                        let latestFile = null;
                        let latestMod = 0;
                        for await (const entry of this.state.pdfFolderHandle.values()) {
                            if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.pdf')) {
                                const file = await entry.getFile();
                                if (file.lastModified > latestMod) {
                                    latestFile = file;
                                    latestMod = file.lastModified;
                                }
                            }
                        }
                        this.hideLoading();
                        if (latestFile) {
                            this.showNotification(`최신 파일 '${latestFile.name}'을 불러옵니다.`);
                            this.handlePdfFileSelect(latestFile);
                        } else {
                            this.showError('지정된 폴더에서 PDF 파일을 찾을 수 없습니다.');
                        }
                    } catch (err) {
                        this.showError(`폴더에서 파일을 읽는 중 오류 발생: ${err.message}`);
                    }
                },

                // --- CORE ANALYSIS LOGIC (TAB 1) ---
                async reanalyzeWithCurrentData() {
                    if (!this.state.pdfPage || !this.state.pdfTextContentItems) return this.showError("재분석할 PDF 데이터가 없습니다. 먼저 파일을 분석해주세요.");
                    this.showLoading('지정된 영역으로 재분석 중...');
                    const canvas = document.createElement('canvas');
                    const scale = 2.0;
                    const viewport = this.state.pdfPage.getViewport({ scale });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await this.state.pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    const result = this.findCourseAndDateFromPdf(this.state.pdfTextContentItems, this.state.selectedDriver, canvas, scale);
                    await this.visualizeTextRestructuring();
                    this.hideLoading();
                    if (result.courseName && result.scheduleDate) {
                        const originalCourseName = result.courseName;

                        this.state.originalFoundCourseName = originalCourseName;
                        this.state.foundCourseName = originalCourseName;
                        this.state.foundScheduleDate = result.scheduleDate;
                        this.state.foundCourseType = result.courseType;

                        this.elements.pdfResultText.innerHTML = `
                            <p><span class="font-semibold">추출된 날짜:</span> ${this.state.foundScheduleDate}</p>
                            <div class="flex items-center justify-center">
                                <span class="font-semibold">추출된 코스:&nbsp;</span><span class="font-bold text-green-800 dark:text-green-200">${this.state.foundCourseName}</span>
                            </div>
                            <p><span class="font-semibold">코스 유형:</span> ${this.state.foundCourseType}</p>`;
                        this.elements.pdfResult.classList.remove('hidden');
                    } else {
                        this.showError("지정된 영역에서 유효한 코스를 찾지 못했습니다.");
                        this.elements.pdfResult.classList.add('hidden');
                    }
                },
                
                async analyzePdf() {
                    if (!this.state.selectedDriver || !this.state.pdfFile) return this.showNotification('기사와 PDF 파일을 선택해주세요.', 3000);
                    this.state.anchorCourseItem = null;
                    this.showLoading('휴차표를 분석 중입니다...');
                    this.elements.pdfVisualizationWrapper.classList.add('hidden'); 
                    try {
                        let pdf = this.state.pdfDoc;
                        if (!pdf) {
                            const typedarray = new Uint8Array(await this.state.pdfFile.arrayBuffer());
                            pdf = await pdfjsLib.getDocument(typedarray).promise;
                            this.state.pdfDoc = pdf;
                        }
                        let finalResult = null;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            if (textContent.items.some(item => item.str.trim() === this.state.selectedDriver)) {
                                this.state.pdfPage = page;
                                this.state.pdfTextContentItems = textContent.items;
                                const scale = 2.0;
                                const viewport = page.getViewport({ scale });
                                const canvas = document.createElement('canvas');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;
                                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                                const result = this.findCourseAndDateFromPdf(textContent.items, this.state.selectedDriver, canvas, scale);
                                await this.visualizeTextRestructuring();
                                if (result.courseName && result.scheduleDate) {
                                    finalResult = result;
                                    break;
                                }
                            }
                        }
                        this.hideLoading();
                        if (finalResult) {
                            const originalCourseName = finalResult.courseName;

                            this.state.originalFoundCourseName = originalCourseName;
                            this.state.foundCourseName = originalCourseName;
                            this.state.foundScheduleDate = finalResult.scheduleDate;
                            this.state.foundCourseType = finalResult.courseType;
                            
                            this.elements.pdfResultText.innerHTML = `
                                <p><span class="font-semibold">추출된 날짜:</span> ${this.state.foundScheduleDate}</p>
                                <div class="flex items-center justify-center">
                                    <span class="font-semibold">추출된 코스:&nbsp;</span><span class="font-bold text-green-800 dark:text-green-200">${this.state.foundCourseName}</span>
                                </div>
                                <p><span class="font-semibold">코스 유형:</span> ${this.state.foundCourseType}</p>`;
                            this.elements.pdfResult.classList.remove('hidden');
                        } else this.showError("선택된 기사의 최신 코스와 날짜를 찾지 못했습니다. PDF 내용을 확인해주세요.");
                    } catch (err) {
                        console.error('PDF Analysis Error:', err);
                        this.showError('PDF 파일을 분석하는 중 오류가 발생했습니다.');
                    }
                },
                
                findCourseAndDateFromPdf(items, driverName, canvas, scale) {
                    this.state.dynamicCourseArea = null; 
                    const lines = items.reduce((acc, item) => {
                        const y = Math.round(item.transform[5]);
                        let line = acc.find(l => Math.abs(l.y - y) < 5);
                        if (line) line.items.push(item); else acc.push({ y, items: [item] });
                        return acc;
                    }, []);
                    lines.forEach(line => line.items.sort((a, b) => a.transform[4] - b.transform[4]));
                    const combinedExclusions = ["휴무", "휴", "비번", "개인", "○개인"];
                    const dateRow = lines.find(line => line.items.some(item => /^\d{1,2}$/.test(item.str.trim())));
                    const driverRowIndex = lines.findIndex(line => line.items.some(item => item.str.trim() === driverName));
                    if (driverRowIndex === -1) return {};
                    const driverItem = lines[driverRowIndex].items.find(item => item.str.trim() === driverName);
                    if (!driverItem) return {};
                    const driverItemIndex = lines[driverRowIndex].items.indexOf(driverItem);
                    const courseItems = lines[driverRowIndex].items.slice(driverItemIndex + 1).filter(item => {
                        const text = item.str.trim();
                        return text && !combinedExclusions.includes(text) && !/^\d+회\d*$/.test(text) && !/^\d+$/.test(text) && /[a-zA-Z0-9가-힣]/.test(text);
                    });
                    const anchorCourseItem = courseItems.length > 0 ? courseItems[courseItems.length - 1] : null;
                    if(anchorCourseItem) this.state.anchorCourseItem = anchorCourseItem;

                    const dynamicArea = this._calculateDynamicArea(this.state.anchorCourseItem, this.state.userDefinedCourseAreaSize, this.state.userDefinedCourseAreaOffset, canvas, scale);
                    let courseName, primaryCourseItem;
                    if (dynamicArea) {
                        const pdfArea = { x: dynamicArea.x / scale, y: (canvas.height - (dynamicArea.y + dynamicArea.height)) / scale, x2: (dynamicArea.x + dynamicArea.width) / scale, y2: (canvas.height - dynamicArea.y) / scale };
                        const itemsInArea = items.filter(i => (i.transform[4] + i.width) > pdfArea.x && i.transform[4] < pdfArea.x2 && (i.transform[5] + i.height) > pdfArea.y && i.transform[5] < pdfArea.y2);
                        if (itemsInArea.length > 0) {
                            itemsInArea.sort((a, b) => Math.abs(b.transform[5] - a.transform[5]) > 2 ? b.transform[5] - a.transform[5] : a.transform[4] - b.transform[4]);
                            courseName = itemsInArea.map(item => item.str.trim()).join(' ');
                            primaryCourseItem = itemsInArea[0];
                        }
                    }
                    if (!courseName && anchorCourseItem) {
                        courseName = anchorCourseItem.str.trim();
                        primaryCourseItem = anchorCourseItem;
                    }
                    if (!primaryCourseItem) return {};
                    const courseXCenter = primaryCourseItem.transform[4] + (primaryCourseItem.width / 2);
                    const dateItem = dateRow?.items.reduce((closest, current) => !/^\d{1,2}$/.test(current.str.trim()) ? closest : (!closest || Math.abs((current.transform[4] + current.width / 2) - courseXCenter) < closest.dist ? { ...current, dist: Math.abs((current.transform[4] + current.width / 2) - courseXCenter) } : closest), null);
                    let courseType = '일반';
                    const samplePoints = [{ x: primaryCourseItem.transform[4] + primaryCourseItem.width + 5, y: primaryCourseItem.transform[5] + (primaryCourseItem.height / 2) }, { x: primaryCourseItem.transform[4] + (primaryCourseItem.width / 2), y: primaryCourseItem.transform[5] + (primaryCourseItem.height / 2) }];
                    const pixelData = canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
                    for (const point of samplePoints) {
                        const canvasX = Math.floor(point.x * scale), canvasY = Math.floor(canvas.height - (point.y * scale));
                        if(canvasX >=0 && canvasX < canvas.width && canvasY >= 0 && canvasY < canvas.height){
                             const pIndex = (canvasY * canvas.width + canvasX) * 4;
                             const type = this.getCourseTypeFromColor(pixelData[pIndex], pixelData[pIndex + 1], pixelData[pIndex+2]);
                             if(type !== '일반') { courseType = type; break; }
                        }
                    }
                    if (!dateItem) return { courseName, courseType };
                    const day = parseInt(dateItem.str.trim(), 10), now = new Date();
                    let month = now.getMonth();
                    if (now.getDate() > 20 && day < 10) month += 1;
                    if (now.getDate() < 10 && day > 20) month -= 1;
                    const scheduleDate = new Date(now.getFullYear(), month, day);
                    return { courseName, courseType, scheduleDate: `${scheduleDate.getFullYear()}-${String(scheduleDate.getMonth() + 1).padStart(2, '0')}-${String(scheduleDate.getDate()).padStart(2, '0')}` };
                },

                getCourseTypeFromColor(r, g, b) {
                    if (r > 240 && g > 240 && b > 240) return '일반'; if (Math.abs(r - g) < 20 && Math.abs(g - b) < 20 && r > 200) return '일반'; if (r > 220 && g > 210 && b < 180) return '중장거리'; if (b > r && b > g && b > 190 && g > 180) return '2회전'; if (r > 245 && g > 200 && g < 240 && b > 160 && b < 220) return '초장거리'; return '일반';
                },
            };

            app.init();
            window.app = app; // For easier debugging
        });
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-4 sm:p-6 transition-colors duration-300">
    <div class="max-w-7xl mx-auto bg-white dark:bg-gray-800 shadow-lg rounded-lg p-4 sm:p-6">
        <header class="border-b border-gray-200 dark:border-gray-700 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">배송 정보 분석</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">휴차표(PDF)와 배차표(이미지/PDF)를 분석하여 스케줄 데이터를 생성합니다.</p>
        </header>

        <main>
            <!-- Panel 1: PDF 휴차표 Analysis -->
            <div id="panel-pdf" role="tabpanel" aria-labelledby="tab-pdf">
                <div class="space-y-4">
                    <div>
                        <label for="driver-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">분석할 기사 선택</label>
                        <select id="driver-select" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 focus:ring-indigo-500 focus:border-indigo-500"></select>
                    </div>

                    <div class="space-y-3 p-4 border border-gray-200 dark:border-gray-700 rounded-lg">
                        <div class="flex items-center justify-between">
                             <h3 class="text-md font-semibold text-gray-800 dark:text-gray-200">휴차표 파일 불러오기</h3>
                             <button id="pdf-set-folder-btn" class="text-sm bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 py-1 px-3 rounded-md hover:bg-gray-300 dark:hover:bg-gray-500">휴차표 폴더 지정</button>
                        </div>
                        <p id="android-pdf-helper" class="hidden text-xs text-gray-500 dark:text-gray-400 -mt-2">(안드로이드) Download/KakaoTalk 폴더를 지정하시면 편리합니다.</p>
                        <p id="pdf-folder-path" class="hidden text-sm text-gray-600 dark:text-gray-400"></p>
                        <button id="pdf-load-latest-btn" class="hidden w-full bg-teal-600 text-white py-2 px-4 rounded-md hover:bg-teal-700">지정 폴더에서 최신 파일 불러오기</button>
                        
                        <div class="relative flex items-center">
                           <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
                           <span class="flex-shrink mx-4 text-xs text-gray-500 dark:text-gray-400">또는</span>
                           <div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div>
                        </div>

                        <div>
                            <label for="pdf-input" id="pdf-file-input-label" class="cursor-pointer block w-full text-center text-sm text-gray-500 dark:text-gray-400 p-3 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                다른 폴더에서 파일 직접 선택하기
                            </label>
                            <input type="file" id="pdf-input" accept=".pdf" class="hidden">
                        </div>
                    </div>
                    
                    <div class="pt-1">
                        <label for="show-visualization-checkbox" class="flex items-center text-sm font-medium text-gray-700 dark:text-gray-300 select-none">
                            <input type="checkbox" id="show-visualization-checkbox" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-2">
                            분석 영역 시각화
                        </label>
                    </div>
                    <button id="pdf-analyze-btn" disabled class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed">날짜 및 코스 분석</button>
                    <div id="pdf-result" class="hidden mt-4 p-4 bg-green-50 dark:bg-green-900/40 border border-green-200 dark:border-green-700 rounded-lg text-center space-y-3">
                        <div id="pdf-result-text" class="text-green-800 dark:text-green-200"></div>
                    </div>
                    <div id="pdf-visualization-wrapper" class="hidden mt-6">
                        <div class="flex justify-between items-center mb-2 flex-wrap gap-y-2">
                            <h3 class="text-lg font-semibold">텍스트 데이터 시각화</h3>
                            <div id="offset-controls" class="flex items-center gap-1 flex-wrap">
                                <span class="text-sm font-medium mr-2">위치 보정:</span>
                                <div class="flex items-center gap-1 border border-gray-300 dark:border-gray-600 rounded-md p-0.5"><button data-action="adjust-offset" data-axis="x" data-value="-1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="좌">-</button><span class="text-sm font-mono w-4 text-center">X</span><button data-action="adjust-offset" data-axis="x" data-value="1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="우">+</button></div>
                                <div class="flex items-center gap-1 border border-gray-300 dark:border-gray-600 rounded-md p-0.5 ml-2"><button data-action="adjust-offset" data-axis="y" data-value="-1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="상">-</button><span class="text-sm font-mono w-4 text-center">Y</span><button data-action="adjust-offset" data-axis="y" data-value="1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="하">+</button></div>
                                <span class="text-sm font-medium ml-4 mr-2">크기 조정:</span>
                                <div class="flex items-center gap-1 border border-gray-300 dark:border-gray-600 rounded-md p-0.5"><button data-action="adjust-size" data-axis="width" data-value="-1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="폭-">-</button><span class="text-sm font-mono w-4 text-center">W</span><button data-action="adjust-size" data-axis="width" data-value="1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="폭+">+</button></div>
                                <div class="flex items-center gap-1 border border-gray-300 dark:border-gray-600 rounded-md p-0.5 ml-2"><button data-action="adjust-size" data-axis="height" data-value="-1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="높이-">-</button><span class="text-sm font-mono w-4 text-center">H</span><button data-action="adjust-size" data-axis="height" data-value="1" class="px-2 py-0.5 rounded-sm hover:bg-gray-200 dark:hover:bg-gray-700" title="높이+">+</button></div>
                                <button id="reanalyze-offset-btn" class="bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 text-xs font-semibold py-1 px-3 rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 ml-3">적용</button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">분석 영역(<span class="text-green-500 font-semibold">녹색</span><span id="dynamic-area-coords" class="ml-1 font-mono text-xs text-green-600 dark:text-green-400"></span>)이 기사명 오른쪽의 코스 위치에 자동으로 적용됩니다.</p>
                        <div id="pdf-visualization-container" class="relative border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-900/50"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-50 items-center justify-center text-white loading-overlay">
        <div class="text-center">
            <svg class="animate-spin h-8 w-8 text-white mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p id="loading-text" class="text-lg font-semibold">처리 중...</p>
        </div>
    </div>
    
    <!-- Error Overlay -->
    <div id="error-overlay" class="hidden fixed inset-0 z-50 items-center justify-center p-4 loading-overlay">
         <div class="bg-white dark:bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-sm text-center">
            <h3 class="text-lg font-bold mb-4 text-red-600 dark:text-red-400">오류 발생</h3>
            <p id="error-message" class="text-gray-600 dark:text-gray-300 mb-6">오류가 발생했습니다.</p>
            <button id="error-retry-btn" class="bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-gray-200 px-4 py-2 rounded hover:bg-gray-400 dark:hover:bg-gray-500">닫기</button>
        </div>
    </div>
</body>
</html>
